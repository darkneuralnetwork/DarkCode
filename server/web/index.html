<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarkCode</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- The shell is two rows: a hairline rail carrying state, and the work.
     There is no navigation chrome. The previous console spent a header, a
     nine-item dropdown and a sidebar on getting between six screens; this
     spends one keystroke, which is how a developer already moves around every
     other tool on their machine. -->
<div class="shell">

  <header class="rail">
    <span class="rail-mark">dark<b>code</b></span>
    <span class="rail-work" id="rail-work" hidden aria-hidden="true"></span>
    <span class="rail-item" id="rail-stage"></span>

    <span class="rail-spacer"></span>

    <span class="rail-item" id="rail-model" title="Model answering this turn"></span>
    <span class="rail-item" id="rail-cost" title="Spend this session"></span>
    <span class="rail-item" id="rail-conn" title="Live connection">—</span>
    <button class="rail-key" id="palette-open" aria-haspopup="dialog">
      <span>Go to</span><kbd>⌘K</kbd>
    </button>
  </header>

  <div class="work" id="work" data-aside="on">

    <!-- The workspace. Collapsible, because the file tree is essential while
         watching an edit land and is furniture the rest of the time. -->
    <aside class="aside" id="aside" aria-label="Workspace">
      <div class="eyebrow">
        <span id="cwd-label">workspace</span>
        <button class="ghost" id="tree-refresh" title="Refresh">↻</button>
      </div>
      <div class="tree" id="tree"><div class="empty">Reading the workspace…</div></div>
    </aside>

    <main class="main" id="main">
      <!-- Views swap in here. One at a time, because a tool that shows you
           six things at once has decided none of them matter. -->
      <div class="thread" id="view-chat">
        <div class="thread-inner" id="thread">
          <div class="turn turn-agent">
            <div class="turn-who">darkcode</div>
            <div class="turn-body" id="greeting">What are we working on?</div>
          </div>
        </div>
      </div>

      <div class="panel" id="view-panel" hidden></div>

      <div class="composer-wrap" id="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Describe what you want built, or ask about this repository…" autocomplete="off"></textarea>
          <div class="composer-row">
            <span class="composer-hint" id="hint"><kbd>⏎</kbd> send · <kbd>⇧⏎</kbd> newline</span>
            <button type="button" class="ghost" id="stop" hidden>Stop</button>
            <button type="submit" class="send" id="send">Send</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<!-- Command palette. Every destination and action in one filtered list. -->
<div class="palette-scrim" id="palette-scrim" hidden role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="palette">
    <input id="palette-input" placeholder="Go to, or run…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list" role="listbox"></div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
