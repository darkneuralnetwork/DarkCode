<!-- Projects — the workspaces the agent can be pointed at.

     A project is a directory plus the standing context that goes with it. One
     is active at a time; activating it is what decides where file tools read
     and write, so this is a page and not a corner of another one. -->
<div class="registry-layout" style="display:flex; flex-direction:column; width:100%; height:100%; overflow:hidden; background:var(--bg-void); padding:24px; gap:24px;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h2 class="gradient-text" style="margin:0; font-size:24px;">Projects</h2>
      <div style="font-size:12px; color:var(--text-mute); margin-top:4px;">
        The active project sets the working directory for every file tool.
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-glow" id="proj-refresh">Reload</button>
      <button class="btn-glow primary" id="proj-new">+ New</button>
    </div>
  </div>

  <div class="glass-panel" id="bp-projects-panel" style="padding:20px; flex:1; overflow-y:auto;">
    <div class="proj-grid" id="proj-grid"></div>
  </div>

</div>
