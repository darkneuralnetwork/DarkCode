<!-- System telemetry — the machine's own account of itself.

     Three records that are only useful as records: what the system currently
     is (status), what it did to your box and whether you allowed it (audit),
     and what it has learned to do differently (strategies).

     Every container here is filled by js/110-status.js, which builds its own
     inner markup — loadAudit even writes its own header row. This page supplies
     the shells and nothing else, and the ids are the ones that module asks for.
     They existed nowhere until now, so none of it had ever rendered. -->
<div class="status-content custom-scrollbar" style="display:flex; flex-direction:column; gap:20px;">

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h2 class="gradient-text" style="margin:0; font-size:24px;">System telemetry</h2>
      <div style="font-size:12px; color:var(--text-mute); margin-top:4px;">
        Capabilities, permissions and the record of what was run.
      </div>
    </div>
    <button class="btn-glow" id="status-refresh">Refresh</button>
  </div>

  <div id="status-content">
    <div class="mem-empty">Loading…</div>
  </div>

  <!-- ── What it did to your machine ──────────────────────────────────── -->
  <div class="glass-panel" style="padding:20px;">
    <div class="chart-head" style="margin-bottom:14px;">
      <h3>📋 Audit</h3>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="chart-sub" id="audit-stats">—</span>
        <button class="fe-btn xs" id="audit-refresh">Refresh</button>
      </div>
    </div>
    <div class="audit-list custom-scrollbar" id="audit-list" style="margin:0; max-height:360px;">
      <div class="mem-empty">No actions recorded yet.</div>
    </div>
  </div>

  <!-- ── What it learned ──────────────────────────────────────────────── -->
  <div class="glass-panel" style="padding:20px;">
    <div class="chart-head" style="margin-bottom:14px;">
      <h3>📈 Learned strategies</h3>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="chart-sub" id="learn-stats">—</span>
        <button class="fe-btn xs" id="learn-refresh">Refresh</button>
      </div>
    </div>
    <div class="s-grid" id="learn-grid">
      <div class="mem-empty">No strategies learned yet. Run more tasks.</div>
    </div>
  </div>

</div>
