<div class="replay-layout" style="display:flex;flex-direction:column;width:100%;height:100%;overflow-y:auto;background:var(--bg-void);padding:24px;gap:20px;">

  <div class="glass-panel" style="padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 class="cfg-h3" style="margin:0;font-size:14px;text-transform:uppercase;">⏱ Execution Replay</h3>
      <button class="fe-btn" id="rp-refresh">↻ Refresh</button>
    </div>
    <p style="color:var(--text-mute);font-size:12px;margin:0 0 12px;">
      Every DAG run is journalled so a crash can resume it. The same record replays here —
      scrub the timeline to see the state of the run at any point.
    </p>
    <select id="rp-run" style="width:100%;padding:8px;background:var(--bg-panel);color:var(--text);
            border:1px solid var(--border);border-radius:6px;font-size:12px;">
      <option value="">Loading runs…</option>
    </select>
  </div>

  <div class="glass-panel" id="rp-player" style="padding:20px;display:none;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
      <span id="rp-position" style="font-size:12px;color:var(--text-dim);">–</span>
      <span id="rp-elapsed" style="font-size:11px;color:var(--text-mute);"></span>
    </div>

    <input type="range" id="rp-slider" min="0" max="0" value="0" step="1"
           style="width:100%;accent-color:var(--accent);cursor:pointer;" />

    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
      <button class="fe-btn" id="rp-first" title="First event">⏮</button>
      <button class="fe-btn" id="rp-prev" title="Previous">◀</button>
      <button class="fe-btn" id="rp-play" title="Play">▶</button>
      <button class="fe-btn" id="rp-next" title="Next">▶|</button>
      <button class="fe-btn" id="rp-last" title="Last event">⏭</button>
      <span id="rp-status" style="margin-left:auto;font-size:11px;"></span>
    </div>
  </div>

  <div class="glass-panel" id="rp-detail-panel" style="padding:20px;display:none;flex:1;min-height:200px;">
    <h4 class="cfg-h3" style="margin:0 0 10px;font-size:12px;text-transform:uppercase;">Event</h4>
    <div id="rp-detail" style="font-family:var(--font-mono);font-size:12px;white-space:pre-wrap;
         word-break:break-word;color:var(--text);"></div>
  </div>

  <div class="glass-panel" id="rp-timeline-panel" style="padding:20px;display:none;">
    <h4 class="cfg-h3" style="margin:0 0 10px;font-size:12px;text-transform:uppercase;">Timeline</h4>
    <div id="rp-timeline" style="display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;"></div>
  </div>

</div>
