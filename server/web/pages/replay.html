<!-- Execution replay — moving through a run after it finished.

     The execution journal exists so a crashed DAG can resume without re-paying
     for model calls it already made. The same ordered record answers a second
     question afterwards: what did this run actually do, and where did it go
     wrong. This page is the scrubber for it.

     js/240-replay.js has always been complete and has always shipped; its
     markup was deleted, so it had never once drawn. The ids below are the ones
     that module queries, and rp-player / rp-timeline-panel / rp-detail-panel
     are shown and hidden by it as a run is selected. -->
<div class="status-content custom-scrollbar rp-page">

  <div class="rp-head">
    <div>
      <h2 class="gradient-text" style="margin:0; font-size:24px;">Execution replay</h2>
      <div style="font-size:12px; color:var(--text-mute); margin-top:4px;">
        Scrub a recorded run. State is folded from the start each time, so moving
        backwards is as accurate as moving forwards.
      </div>
    </div>
    <button class="btn-glow" id="rp-refresh">Reload runs</button>
  </div>

  <div class="glass-panel rp-picker">
    <label class="rp-label" for="rp-run">Run</label>
    <select id="rp-run" class="custom-select rp-select">
      <option value="">No recorded runs yet</option>
    </select>
  </div>

  <!-- ── Transport ─────────────────────────────────────────────────────── -->
  <div class="glass-panel rp-player" id="rp-player" style="display:none;">
    <div class="rp-readout">
      <div class="rp-position" id="rp-position">—</div>
      <div class="rp-meta">
        <span id="rp-elapsed"></span>
        <span id="rp-status"></span>
      </div>
    </div>

    <input type="range" class="rp-slider" id="rp-slider" min="0" max="0" value="0" step="1"
           aria-label="Position in the run">

    <div class="rp-transport">
      <button class="rp-btn" id="rp-first" title="First event">⏮</button>
      <button class="rp-btn" id="rp-prev" title="Previous event">◀</button>
      <button class="rp-btn rp-btn-play" id="rp-play" title="Play or pause">▶</button>
      <button class="rp-btn" id="rp-next" title="Next event">▶</button>
      <button class="rp-btn" id="rp-last" title="Last event">⏭</button>
    </div>
  </div>

  <!-- ── The run, and the event you are parked on ──────────────────────── -->
  <div class="rp-split">
    <div class="glass-panel rp-timeline-panel" id="rp-timeline-panel" style="display:none;">
      <div class="chart-head" style="margin-bottom:12px;">
        <h3>Timeline</h3>
        <span class="chart-sub">click any step to jump</span>
      </div>
      <div class="rp-timeline custom-scrollbar" id="rp-timeline"></div>
    </div>

    <div class="glass-panel rp-detail-panel" id="rp-detail-panel" style="display:none;">
      <div class="chart-head" style="margin-bottom:12px;">
        <h3>This step</h3>
      </div>
      <pre class="rp-detail custom-scrollbar" id="rp-detail"></pre>
    </div>
  </div>

</div>
