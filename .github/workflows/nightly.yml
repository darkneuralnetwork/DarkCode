name: Nightly

# The per-PR gate is tuned to be fast. This is where the slower, flakier and
# more thorough checks live — the ones worth knowing about but not worth
# blocking a merge on.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: # so a maintainer can run it on demand

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # -count=1 defeats the test cache: a nightly run that replays yesterday's
      # cached results proves nothing.
      - name: Tests (race, uncached)
        run: go test -race -count=1 ./...

      # Repeated runs surface order-dependence and genuine flakiness, which a
      # single pass hides.
      #
      # Paths updated for the "redesign the root directory by architectural
      # layer" restructure: memory/, orchestrator/, tools/, permission/ moved
      # to memory/..., kernel/orchestrator/..., tools/..., infra/permission/.
      - name: Flake hunt
        run: go test -count=5 -run 'Test' ./memory/... ./kernel/orchestrator/... ./tools/... ./infra/permission/...

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./... > /dev/null
          go tool cover -func=coverage.out | tail -1

      - name: Benchmark fixtures
        run: go test ./bench/ -run 'Shipped' -v

      - name: Reproducible build check
        run: |
          # Two builds of the same tree must be byte-identical, or the
          # "reproducible releases" claim in the README is false.
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/a .
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /tmp/b .
          if ! cmp -s /tmp/a /tmp/b; then
            echo "build is not reproducible: two builds of the same tree differ"
            exit 1
          fi
          echo "reproducible: $(sha256sum /tmp/a | cut -d' ' -f1)"

      # The vulnerability scan used to live here and is now in
      # .github/workflows/security.yml, where it also gates pull requests. It
      # was the reason this job was red for five days: a security failure
      # buried in a workflow named "Nightly", next to a flake hunt, reads as
      # flake and gets ignored. A finding should land in the workflow named
      # for it.
