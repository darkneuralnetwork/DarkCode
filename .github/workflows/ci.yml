name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: Build
        run: make build

      - name: Test (race)
        run: make test-race

      # The benchmark suite needs a live model, so CI cannot score it. What CI
      # can enforce is that the harness and every task fixture stay valid —
      # each task loads and is still solvable by its reference solution. A
      # broken fixture would otherwise sit undetected until a benchmark run
      # scored zero for the wrong reason.
      - name: Benchmark fixtures
        run: go test ./bench/ -run 'Shipped' -v

      - name: SBOM
        run: make sbom && cat SBOM.txt

  build-matrix:
    # Prove the single binary cross-compiles for the platforms we ship.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null .
